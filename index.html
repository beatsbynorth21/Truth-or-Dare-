<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>After Dark ❤️</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#090909;
color:white;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.bg{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}

.heart{
position:absolute;
font-size:20px;
opacity:.08;
animation:float linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh) rotate(0deg);
}
to{
transform:translateY(-120vh) rotate(360deg);
}
}

.app{
width:95%;
max-width:500px;
height:92vh;
background:#121212;
border-radius:28px;
padding:18px;
display:flex;
flex-direction:column;
box-shadow:0 0 40px rgba(255,0,120,.15);
border:1px solid rgba(255,255,255,.05);
}

.top{
text-align:center;
margin-bottom:15px;
}

.top h1{
font-size:2rem;
color:#ff4f9a;
}

.sub{
opacity:.7;
font-size:.9rem;
margin-top:5px;
}

.score{
margin-top:10px;
background:#1d1d1d;
padding:10px;
border-radius:15px;
font-size:.9rem;
}

.typing{
height:18px;
font-size:.8rem;
opacity:.7;
margin-top:5px;
}

.chat{
flex:1;
overflow-y:auto;
padding:10px 0;
display:flex;
flex-direction:column;
gap:12px;
}

.msg{
padding:14px;
border-radius:18px;
max-width:80%;
animation:pop .2s ease;
position:relative;
}

.mine{
align-self:flex-end;
background:#ff4f9a;
}

.theirs{
align-self:flex-start;
background:#242424;
}

.user{
font-size:.8rem;
opacity:.8;
margin-bottom:5px;
}

.reactions{
margin-top:8px;
display:flex;
gap:6px;
font-size:18px;
cursor:pointer;
}

@keyframes pop{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

.bottom{
display:flex;
gap:10px;
margin-top:10px;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:16px;
background:#1e1e1e;
color:white;
outline:none;
}

button{
border:none;
padding:14px 18px;
border-radius:16px;
background:#ff4f9a;
color:white;
cursor:pointer;
font-weight:bold;
}

.tools{
display:flex;
gap:10px;
margin-top:10px;
}

.questionBox{
background:#191919;
padding:14px;
border-radius:18px;
margin-bottom:12px;
}

.question{
font-size:1rem;
line-height:1.5;
}

.voiceBtn{
background:#272727;
}

.addQuestion{
display:flex;
gap:10px;
margin-top:10px;
}

.addQuestion input{
font-size:.9rem;
}

</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="app">

<div class="top">
<h1>After Dark ❤️</h1>
<div class="sub">private space for you two</div>

<div class="score" id="score">
Compatibility Score: 0%
</div>

<div class="typing" id="typing"></div>
</div>

<div class="questionBox">
<div class="question" id="question">
Tap “New Question” 👀
</div>

<div class="tools">
<button onclick="newQuestion()">New Question</button>
<button class="voiceBtn" onclick="startVoice()">🎤 Voice</button>
</div>
</div>

<div class="chat" id="chat"></div>

<div class="addQuestion">
<input type="text" id="customQuestion" placeholder="Add your own spicy question..." />
<button onclick="addQuestion()">Add</button>
</div>

<div class="bottom">
<input type="text" id="message" placeholder="Type something..." />
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDVDoLK24DasVCeNdYDddVeTkrVGb7k6GU",
authDomain: "truth-or-dare-b8a05.firebaseapp.com",
databaseURL: "https://truth-or-dare-b8a05-default-rtdb.firebaseio.com",
projectId: "truth-or-dare-b8a05",
storageBucket: "truth-or-dare-b8a05.firebasestorage.app",
messagingSenderId: "254687375783",
appId: "1:254687375783:web:fac2b72d6a310caaa8c682",
measurementId: "G-5Q5P54M0TQ"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let username = localStorage.getItem("darkUser");

if(!username){
username = prompt("Your name?");
localStorage.setItem("darkUser", username);
}

const room = "private-room";

const chat = document.getElementById("chat");
const typing = document.getElementById("typing");
const input = document.getElementById("message");
const questionEl = document.getElementById("question");

const questions = [
"What’s something you’ve imagined doing with me but never said?",
"What outfit would you want me in right now?",
"What’s your favorite memory of us alone?",
"What instantly turns you on about me?",
"Where do you want me to kiss you most?",
"What would our perfect night together look like?",
"What’s one thing you’d never admit publicly but would tell me?",
"What’s your favorite thing about my body?",
"What’s the most intense thing you’ve felt with me?",
"If we were alone tonight with no limits, what happens first?"
];

function updateScore(){
const score = Math.floor(Math.random() * 41) + 60;
document.getElementById("score").innerHTML =
"Compatibility Score: " + score + "% ❤️";
}

updateScore();

function sendMessage(){

const text = input.value.trim();

if(text === "") return;

db.ref("rooms/" + room + "/messages").push({
user: username,
text: text,
time: Date.now()
});

input.value = "";
}

input.addEventListener("keypress", e=>{
if(e.key === "Enter"){
sendMessage();
}
});

db.ref("rooms/" + room + "/messages")
.on("child_added", snap=>{

const msg = snap.val();

const div = document.createElement("div");

div.classList.add("msg");

if(msg.user === username){
div.classList.add("mine");
}else{
div.classList.add("theirs");
}

div.innerHTML = `
<div class="user">${msg.user}</div>
<div>${msg.text}</div>

<div class="reactions">
<span onclick="react('❤️')">❤️</span>
<span onclick="react('🥵')">🥵</span>
<span onclick="react('😈')">😈</span>
</div>
`;

chat.appendChild(div);

chat.scrollTop = chat.scrollHeight;
});

function react(emoji){
db.ref("rooms/" + room + "/messages").push({
user:"System",
text: username + " reacted " + emoji,
time:Date.now()
});
}

input.addEventListener("input", ()=>{

db.ref("rooms/" + room + "/typing").set(username);

clearTimeout(window.typeTimer);

window.typeTimer = setTimeout(()=>{
db.ref("rooms/" + room + "/typing").set("");
},1000);

});

db.ref("rooms/" + room + "/typing")
.on("value", snap=>{

const typer = snap.val();

if(typer && typer !== username){
typing.innerHTML = typer + " is typing...";
}else{
typing.innerHTML = "";
}

});

function newQuestion(){

const random =
questions[Math.floor(Math.random() * questions.length)];

questionEl.innerHTML = random;

db.ref("rooms/" + room + "/question").set(random);
}

db.ref("rooms/" + room + "/question")
.on("value", snap=>{

if(snap.val()){
questionEl.innerHTML = snap.val();
}

});

function addQuestion(){

const val =
document.getElementById("customQuestion").value.trim();

if(val === "") return;

questions.push(val);

db.ref("rooms/" + room + "/messages").push({
user:"System",
text: username + " added a new question 👀",
time:Date.now()
});

document.getElementById("customQuestion").value = "";
}

function startVoice(){

if(!navigator.mediaDevices){
alert("Voice notes not supported");
return;
}

navigator.mediaDevices.getUserMedia({audio:true})
.then(stream=>{

const mediaRecorder =
new MediaRecorder(stream);

let chunks = [];

mediaRecorder.start();

alert("Recording... press OK after 5 seconds");

setTimeout(()=>{
mediaRecorder.stop();
},5000);

mediaRecorder.ondataavailable = e=>{
chunks.push(e.data);
};

mediaRecorder.onstop = ()=>{

const blob = new Blob(chunks,{
type:'audio/mp3'
});

const reader = new FileReader();

reader.readAsDataURL(blob);

reader.onloadend = ()=>{

db.ref("rooms/" + room + "/messages").push({
user: username,
voice: reader.result,
time: Date.now()
});

};

};

});

}

db.ref("rooms/" + room + "/messages")
.on("child_added", snap=>{

const msg = snap.val();

if(msg.voice){

const div = document.createElement("div");

div.classList.add("msg");

if(msg.user === username){
div.classList.add("mine");
}else{
div.classList.add("theirs");
}

div.innerHTML = `
<div class="user">${msg.user}</div>

<audio controls src="${msg.voice}"></audio>
`;

chat.appendChild(div);

chat.scrollTop = chat.scrollHeight;

}

});

function createHeart(){

const heart = document.createElement("div");

heart.classList.add("heart");

heart.innerHTML = "❤️";

heart.style.left = Math.random() * 100 + "vw";

heart.style.animationDuration =
(Math.random() * 4 + 4) + "s";

heart.style.fontSize =
(Math.random() * 20 + 15) + "px";

document.getElementById("bg")
.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);
}

setInterval(createHeart,500);

</script>

</body>
</html>
